name: Publish packages

# Manual only. Each run must name a commit on main whose Check run succeeded; nothing is
# published automatically from a push.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA on main to publish"
        required: true

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Refuse anything but a main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          conclusion=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
            --jq '[.check_runs[] | select(.name | startswith("package") or startswith("collection"))] as $runs
                  | if ($runs | length) == 0 then "missing"
                    elif ([$runs[] | select(.conclusion != "success")] | length) > 0 then "failed"
                    else "success" end')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Check runs for $sha are $conclusion."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # Trusted publishing needs a recent npm; no npm token is stored in this repository.
      - run: npm install --global npm@latest

      - name: Publish the packages with pending version bumps
        run: npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Report what was published
        if: always()
        run: |
          {
            echo "| Package | Version in tree | Version on npm |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for package in pi-delete pi-minimal-display; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            published=$(npm view "$name@$version" version 2>/dev/null || echo "not published")
            echo "| \`$name\` | $version | $published |" >> "$GITHUB_STEP_SUMMARY"
          done
