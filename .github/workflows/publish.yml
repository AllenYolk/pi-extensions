name: Publish packages

# Manual only. Each run must name a commit on main whose Check run succeeded; nothing is
# published automatically from a push.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA on main to publish"
        required: true

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Require a commit SHA and the main workflow
        env:
          PUBLISH_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$PUBLISH_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch from main with a full commit SHA."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Refuse anything but a main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          conclusion=$(gh api --method GET "repos/$GH_REPO/actions/workflows/check.yml/runs" \
            -f head_sha="$sha" -f branch=main -f event=push -f per_page=1 \
            --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else "missing or pending" end')
          if [ "$conclusion" != "success" ]; then
            echo "::error::The full Check workflow for $sha is $conclusion."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          registry-url: "https://registry.npmjs.org"

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require applied version changes
        run: |
          for change in .changeset/*.md; do
            if [ -f "$change" ] && [ "$change" != ".changeset/README.md" ]; then
              echo "::error::Merge the reviewed version PR before publishing ($change is pending)."
              exit 1
            fi
          done

      # Trusted publishing needs a recent npm; no npm token is stored in this repository.
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Publish the packages with pending version bumps
        run: npm run publish-packages
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Preserve package release tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm exec -- changeset git-tag
          for package in pi-delete pi-minimal-display; do
            tag=$(node -p "const p = require('./packages/$package/package.json'); p.name + '@' + p.version")
            git push origin "refs/tags/$tag"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --verify-tag --title "$tag" \
                --notes-file "packages/$package/CHANGELOG.md"
            fi
          done

      - name: Report what was published
        if: always()
        run: |
          {
            echo "| Package | Version in tree | Version on npm |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for package in pi-delete pi-minimal-display; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            published=$(npm view "$name@$version" version 2>/dev/null || echo "not published")
            echo "| \`$name\` | $version | $published |" >> "$GITHUB_STEP_SUMMARY"
          done
